services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf-editor-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf-editor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: pdf-editor-network
