server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Allow large file uploads (up to 100 MB total)
        client_max_body_size 100m;
        proxy_read_timeout   120s;
    }

    # Do not let SPA fallback swallow real asset paths (e.g. pdfjs .mjs worker)
    location /assets/ {
        try_files $uri =404;
    }

    # .mjs must be application/javascript (browsers reject module loads as octet-stream)
    # This block must be listed *before* the generic static regex below; same regex also wins
    # over a plain /assets/ prefix, so we force MIME here.
    location ~* \.mjs$ {
        try_files $uri =404;
        types { }
        default_type application/javascript;
        charset utf-8;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (.mjs handled above)
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
