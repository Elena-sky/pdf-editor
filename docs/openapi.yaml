openapi: 3.0.3
info:
  title: PDF Editor API
  version: 1.0.0
  description: |
    Merge, preview, and split PDF uploads.

    **Enforcement:** limits are applied by multer (`application/pdf` MIME, per-file size, merge file count).
    Defaults: 100 MB per file, up to 20 files on merge. Configure via `MAX_FILE_SIZE_MB` on the backend.
    `GET /api/config` returns the active limits for UI hints.

servers:
  - url: /api
    description: Same origin (proxied to backend in dev)

paths:
  /config:
    get:
      summary: Upload limits for clients
      operationId: getConfig
      responses:
        '200':
          description: Active limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadConfig'

  /merge-pdf:
    post:
      summary: Merge PDF files
      operationId: mergePdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 2–20 PDF files (see server `MAX_FILES`)
                order:
                  type: string
                  description: Comma-separated indices for merge order
      responses:
        '200':
          description: Merged PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorJson'
        '422':
          $ref: '#/components/responses/ErrorJson'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /preview-pdf:
    post:
      summary: PDF metadata (page count)
      operationId: previewPdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewMeta'
        '400':
          $ref: '#/components/responses/ErrorJson'
        '422':
          $ref: '#/components/responses/ErrorJson'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /split-pdf:
    post:
      summary: Extract page range
      operationId: splitPdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - from
                - to
              properties:
                file:
                  type: string
                  format: binary
                from:
                  type: integer
                  minimum: 1
                  description: Start page (1-based, inclusive)
                to:
                  type: integer
                  minimum: 1
                  description: End page (1-based, inclusive)
      responses:
        '200':
          description: Extracted PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorJson'
        '422':
          $ref: '#/components/responses/ErrorJson'
        '500':
          $ref: '#/components/responses/ErrorJson'

components:
  schemas:
    UploadConfig:
      type: object
      required:
        - maxFileSizeMb
        - maxFiles
        - acceptedMime
      properties:
        maxFileSizeMb:
          type: number
          example: 100
        maxFiles:
          type: integer
          example: 20
        acceptedMime:
          type: string
          example: application/pdf

    PreviewMeta:
      type: object
      required:
        - fileName
        - pageCount
        - fileSize
      properties:
        fileName:
          type: string
        pageCount:
          type: integer
        fileSize:
          type: integer

    ErrorBody:
      type: object
      required:
        - error
      properties:
        error:
          type: string

  responses:
    ErrorJson:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
